name: Build and Release iOS

on:
  workflow_call:
    inputs:
      build_number:
        required: false
        type: string
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
#  test:
#    runs-on: macos-latest
#    steps:
