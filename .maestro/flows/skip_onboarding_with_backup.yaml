appId: com.lift.bro

---
- runFlow:
    file: onboarding_select_bro.yaml
- tapOn: "Consent"
- tapOn: "Continue"
# Build the deep link URL from the generated backup JSON
- runScript:
    file: scripts/encode_backup.js
# Open the deep link to restore the backup
- openLink: ${output.restoreUrl}
# Dismiss the backup reminder dialog if it appears
- tapOn:
    text: "Ignore"
    optional: true
# Confirm the restore dialog
- tapOn: "Restore"
